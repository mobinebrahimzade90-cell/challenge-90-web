name: Validate Challenge 90
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse every inline JavaScript block
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      if not self.external:
                          self.blocks.append("".join(self.parts))
                      self.active = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          for i, block in enumerate(parser.blocks):
              Path(f"/tmp/c90-inline-{i}.js").write_text(block, encoding="utf-8")
          print(f"Extracted {len(parser.blocks)} inline script blocks")
          if not parser.blocks:
              raise SystemExit("No inline scripts were found")
          PY
          for file in /tmp/c90-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: challenge90_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d challenge90_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create minimal Supabase-compatible test schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d challenge90_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text,
            raw_user_meta_data jsonb
          );
          create table public.profiles (
            user_id uuid primary key,
            username text unique,
            display_name text,
            role text not null default 'participant',
            grade smallint,
            major text,
            class_name text,
            initial_days integer,
            start_date date
          );
          create table public.daily_reports (
            user_id uuid not null references public.profiles(user_id),
            report_date date not null,
            payload jsonb,
            updated_at timestamptz,
            unique(user_id, report_date)
          );
          -- Simulate legacy permissive policies and PUBLIC grants that must be neutralized.
          alter table public.profiles enable row level security;
          alter table public.daily_reports enable row level security;
          create policy legacy_public_profiles_read on public.profiles for select to public using (true);
          create policy legacy_public_reports_read on public.daily_reports for select to public using (true);
          grant all on public.profiles, public.daily_reports to public;
          create function auth.uid() returns uuid
          language sql stable
          as $auth_uid$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $auth_uid$;
          grant usage on schema auth to anon, authenticated;
          SQL
      - name: Apply hardening migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d challenge90_test -v ON_ERROR_STOP=1 -f supabase/security_hardening.sql
      - name: Exercise day validation and ranking RPCs
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d challenge90_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id,email,raw_user_meta_data)
          values (
            '00000000-0000-0000-0000-000000000003',
            'signup90@example.com',
            '{"username":"signup90","display_name":"Signup","grade":12,"major":"کامپیوتر","class_name":"کلاس الف","role":"admin"}'::jsonb
          );
          do $c90_signup_test$
          begin
            if not exists(
              select 1 from public.profiles
              where user_id='00000000-0000-0000-0000-000000000003'
                and role='participant'
                and start_date=current_date
            ) then
              raise exception 'Signup trigger accepted wrong role or failed to set server start date';
            end if;
          end $c90_signup_test$;
          insert into public.profiles(user_id, username, display_name, role, grade, major, class_name, initial_days, start_date)
          values
            ('00000000-0000-0000-0000-000000000001','admin90','Admin','admin',12,'کامپیوتر','کلاس الف',0,current_date),
            ('00000000-0000-0000-0000-000000000002','user90','User','participant',12,'کامپیوتر','کلاس الف',3,current_date);
          insert into public.daily_reports(user_id, report_date, payload, updated_at)
          values
            ('00000000-0000-0000-0000-000000000002',date '2000-01-01',
             '{"start":"2026-11-21","days":{"1":{"st":"clean","tasks":[{"s":"y"},{"s":"n"}]},"91":{"st":"clean"}},"hyp":{"days":{"1":{"st":"done","min":"180"},"21":{"st":"done","min":"999999999999999999999999"}}}}'::jsonb,now()),
            ('00000000-0000-0000-0000-000000000001',date '2026-11-22','{"days":{}}'::jsonb,now());
          do $$
          declare v jsonb; v_count integer;
          begin
            v := public.c90_valid_day_map('{"1":{"st":"clean","min":"999999999999999999999999"},"91":{"st":"clean"},"999999999999999999999999":{"st":"clean"}}'::jsonb,90);
            select count(*) into v_count from jsonb_object_keys(v);
            if v_count <> 1 or v->'1'->>'min' <> '0' then
              raise exception 'Day-map sanitization test failed: %', v;
            end if;
          end $$;
          set role anon;
          do $c90_anon_test$
          declare denied boolean := false;
          begin
            begin
              perform count(*) from public.profiles;
              perform count(*) from public.daily_reports;
            exception when insufficient_privilege then denied := true;
            end;
            if not denied then raise exception 'Anonymous role accessed private account data'; end if;
          end $c90_anon_test$;
          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000002',false);
          do $c90_rls_participant$
          declare profile_count integer; report_count integer; denied boolean := false;
          begin
            select count(*) into profile_count from public.profiles;
            select count(*) into report_count from public.daily_reports;
            if profile_count <> 1 or report_count <> 1 then
              raise exception 'Participant RLS isolation failed: profiles %, reports %', profile_count, report_count;
            end if;
            begin
              insert into public.daily_reports(user_id, report_date, payload)
              values ('00000000-0000-0000-0000-000000000001',current_date,'{}'::jsonb);
            exception when others then denied := true;
            end;
            if not denied then raise exception 'Participant inserted another user report'; end if;
          end $c90_rls_participant$;
          select * from public.class_ranking();
          select * from public.individual_ranking();
          do $c90_test$
          declare denied boolean := false;
          begin
            begin
              update public.profiles
              set start_date = current_date - 1
              where user_id = '00000000-0000-0000-0000-000000000002';
            exception when others then
              denied := true;
            end;
            if not denied then
              raise exception 'Participant was able to change protected start_date';
            end if;
          end $c90_test$;
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',false);
          do $c90_rls_admin$
          declare profile_count integer; report_count integer;
          begin
            select count(*) into profile_count from public.profiles;
            select count(*) into report_count from public.daily_reports;
            if profile_count <> 3 or report_count <> 2 then
              raise exception 'Admin RLS access failed: profiles %, reports %', profile_count, report_count;
            end if;
          end $c90_rls_admin$;
          select public.c90_admin_set_start_date('00000000-0000-0000-0000-000000000002',current_date);
          reset role;
          SQL
