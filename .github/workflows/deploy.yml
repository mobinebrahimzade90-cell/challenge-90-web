name: Deploy web app
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Remove stale Pages artifacts from previous attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              name: "github-pages"
            });
            for (const artifact of data.artifacts) {
              core.info(`Removing stale Pages artifact ${artifact.id}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Wait until Pages artifact is visible to GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 12;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              const artifact = data.artifacts.find(item =>
                item.name === "github-pages" && !item.expired
              );
              if (artifact) {
                core.info(`Pages artifact is visible (ID: ${artifact.id}, attempt: ${attempt}).`);
                return;
              }
              core.info(`Pages artifact not visible yet (attempt ${attempt}/${maxAttempts}). Waiting 5 seconds.`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error("GitHub did not expose the uploaded github-pages artifact after 60 seconds.");
      - id: deployment
        uses: actions/deploy-pages@v4
