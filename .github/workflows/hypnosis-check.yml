name: Validate hypnosis timer
on:
  push:
    branches:
      - fix/hypnosis-mainline
  pull_request:
    paths:
      - index.html
      - .github/workflows/hypnosis-check.yml
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      if not self.external:
                          self.blocks.append("".join(self.parts))
                      self.active = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.blocks:
              raise SystemExit("No inline scripts were found")
          for i, block in enumerate(parser.blocks):
              Path(f"/tmp/c90-{i}.js").write_text(block, encoding="utf-8")
          print(f"Extracted {len(parser.blocks)} inline script blocks")
          PY
          for file in /tmp/c90-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
